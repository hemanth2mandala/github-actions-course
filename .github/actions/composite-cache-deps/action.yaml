name: Cache Node and NPM Dependencies
description: This action allows to cache Node and NPM dependencies based on the package-lock.json file

inputs:
  node-version:
    description: The Node.js version to use
    default: 24.x
    required: true
  working-dir:
    description: The working directory for the action
    default: '.'
    required: false
  target-env:
    description: The target environment for the action
    default: 'dev'
    required: false

runs:
  using: composite
  steps:
    - name: Setup NodeJS Version
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version}}
    - name: Cache Dependencies
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ inputs.working-dir }}/node_modules
        key: node-modules-${{ inputs.target-env }}-${{ hashFiles(format('{0}/{1}', inputs.working-dir, 'package-lock.json')) }}
    - name: Install Dependencies
      if: steps.cache.outputs.cache-hit != 'true' 
      run: ${{ inputs.target-env == 'dev' && 'npm ci' || 'npm ci --omit=dev' }}
      shell: bash
      working-directory: ${{ inputs.working-dir }}

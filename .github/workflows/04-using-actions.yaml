name: 04-using-actions

on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 04-using-actions/react-app
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24.x"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run Unit Tests
              run: npm  test

name: 09 - Functions
on:
  workflow_dispatch:

jobs:
  echo1:
    runs-on: ubuntu-latest
    steps:
      - name: Print PR Title
        run: echo "${{github.event.pull_request.title}}"

      - name: Print PR labels
        run: |
          cat << EOF
          ${{ toJSON(github.event.pull_request.labels)}}
          EOF
      - name: Success step
        run: exit 0
      - name: I will be executed only if the previous step succeeds
        if: ${{ success() }}
        run: echo "I will print if previous steps succeed."
      - name: I will execute only if the previous step fails
        if: ${{ failure() }}
        run: echo "I will print if any previous step fails."

      - name: I will execute this step always if the workflow is not cancelled
        if: ${{ !cancelled() }}
        run: echo "I will print always except if the workflow is cancelled."

      - name: I will execute this step only if the workflow is cancelled
        if: ${{ cancelled() }}
        run: echo "I will print only if the workflow is cancelled."

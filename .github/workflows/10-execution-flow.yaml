name: 10 - Controlling the Execution Flow

on:
    workflow_dispatch:
        inputs:
            pass-unit-tests:
                description: Whether Unit Test Pass or Fail
                type: boolean
                default: true

jobs:
    lint-build:
        runs-on: ubuntu-latest
        steps:
            - name: Lint and build
              run: echo "Linting and building project"

    unit-tests:
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - name: Run unit tests
              run: echo "Running tests..."

            - name: Failing tests
              if: ${{ !inputs.pass-unit-tests }}
              run: exit 1

    deploy-to-nonprod:
        runs-on: ubuntu-latest
        needs:
            - lint-build
            - unit-tests
        steps:
            - name: Deploy to non-prod
              run: echo "Deploying to non-prod environment"

    e2e-tests:
        runs-on: ubuntu-latest
        needs:
            - deploy-to-nonprod
        steps:
            - name: Run e2e tests
              run: echo "Running e2e tests..."
    load-tests:
        runs-on: ubuntu-latest
        needs:
            - deploy-to-nonprod
        steps:
            - name: Run load tests
              run: echo "Running load tests..."

    deploy-to-prod:
        runs-on: ubuntu-latest
        needs:
            - e2e-tests
            - load-tests
        steps:
            - name: Deploy to prod
              run: echo "Deploying to prod environment"

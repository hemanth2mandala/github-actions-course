name: 07 - Using Expressions
run-name: 07 - Using Expressions | Debug -  ${{inputs.debug && 'ON' || 'OFF'}}

on:
  push:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        default: false

jobs:
  display-setup-information:
    runs-on: ubuntu-latest
    steps:
      - name: Display [Debug] Setup Information
        if: ${{inputs.debug == true}}
        run: |
          echo "Triggered by: ${{github.event_name}}"
          echo "Branch Name: ${{github.ref_name}}"
          echo "Commit SHA: ${{github.sha}}"

      - name: Display [Debug] Workflow Information from main
        if: ${{inputs.debug == true && github.ref == 'refs/heads/main'}}
        run: |
          echo "This workflow was triggered by the main branch"

      - name: Display Greetings
        run: echo "Hello, Welcome to the GitHub Actions Course!"

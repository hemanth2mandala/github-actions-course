name: 12 - Working with outputs

on:
    workflow_dispatch:
        inputs:
            build-status:
                type: choice
                options:
                    - success
                    - failure
                default: success

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            build-status: ${{ steps.build.outputs.status }}
        steps:
            - name: Print Github Path
              run: |
                  echo "GITHUB_PATH: $GITHUB_PATH"
            - name: Build
              id: build
              run: echo "status=${{ inputs.build-status}}" >> "$GITHUB_PATH"

    deploy:
        runs-on: ubuntu-latest
        needs: build
        if: ${{ needs.build.outputs.build-status == 'success' }}
        steps:
            - name: Deploy application
              run: echo "Deploying application..."

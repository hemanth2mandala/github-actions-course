name: 17 - 1- Custom Action Composite Workflow
run-name: 17 - 1- Custom Action Composite Workflow | environment - ${{ inputs.target-env }}

on:
    workflow_dispatch:
        inputs:
            target-env:
                description: The target environment for the action
                type: choice
                options:
                  - dev
                  - prod
env:
    working-directory: 17-custom-actions/react-app
    
jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ${{ env.working-directory }}
        steps:
            - uses: actions/checkout@v7
            - name: Setup Node and NPM Dependencies
              uses: ./.github/actions/composite-cache-deps
              with:
                  node-version: 24.x
                  working-dir: ${{ env.working-directory }}
                  target-env: ${{ inputs.target-env }}
            - name: Test the React App
              run: npm test
            - name: Build the React App
              run: npm run build

